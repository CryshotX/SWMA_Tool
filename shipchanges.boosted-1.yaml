# cursor: disable
# yaml-language-server: $schema=./shipchanges.schema.json

# SWMA Tool Default-Konfiguration
# Alle Werte sind auf den neutralen Stand zurückgesetzt.
game_mode: skirmish

units:
  Acclamator_I_Carrier:
    template: Template_Acclamator_I_Carrier
    base_unit: Skirmish_Acclamator_I_Carrier
    campaign_unit: Acclamator_I_Carrier
    cost_changes:
      Tactical_Build_Cost_Multiplayer: -50%
      Build_Cost_Credits: -50%
    template_changes:
      shield_points: +50%
      shield_refresh_rate: +100%
      population_value: 10
      energy_refresh_rate: +400%
    hardpoints:
      damage_increase: +30%
      fire_rate_increase: +30%
      burst_delay_adjustment: -30%
    squadrons:
      delay_seconds: 5
      starting:
        0:
          - type: Clone_ARC_170_Squadron
            count: 2
          - type: Clone_Nimbus_V_Wing_Squadron
